name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    name: Template evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: nix flake show
        run: nix flake show

      # Evaluates every registered template against this checkout: the expected
      # members, a NixOS configuration per member, the per-cluster CLI app, the
      # resolved converge order, and the converge steps WITH their deps. Also
      # evaluates every member's toplevel, which catches option and type errors
      # across the whole configuration — without building anything.
      - name: Check templates
        run: ./scripts/check-templates.sh

  prune:
    name: Prune logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # Pruning is the only part of converge that deletes things, so its safety
      # rules are verified on every change: the engine's branches against an
      # injected registry, and the real k3s step against stubbed kubectl/ssh.
      - name: Check prune logic
        run: ./scripts/check-prune.sh

  teardown:
    name: Teardown logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # Teardown removes everything a cluster created, so its plan and its
      # command are verified on every change: the order (converge in reverse),
      # what a member is switched back to, and the real command — prompt,
      # dry run, unreachable and failing members — against stubbed ssh/nix.
      - name: Check teardown logic
        run: ./scripts/check-teardown.sh

  modules:
    name: Module combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # The templates load one or two modules each; bugs live where modules
      # meet. A fixture flake combines them the way a real cluster does and the
      # NixOS side is checked by evaluation only.
      - name: Check module combinations
        run: ./scripts/check-modules.sh

  converge:
    name: Converge logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      # converge decides install-vs-switch per member and gates every step on
      # the ones before it. The real command runs against stubbed hosts:
      # dry run, installed, fresh and installer members, hangs and reboots.
      - name: Check converge logic
        run: ./scripts/check-converge.sh
